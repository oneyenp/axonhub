name: Build

on:
  push:
    branches:
      - feature/project-storage-policy

permissions:
  contents: write

jobs:
  implement-project-storage-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/project-storage-policy
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract implementation scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/project-storage-policy-generate.yml').read_text()
          chunks = text.split("python3 <<'PY'\n")[1:]
          if len(chunks) != 2:
              raise SystemExit(f'expected 2 python blocks, found {len(chunks)}')
          for i, chunk in enumerate(chunks):
              code = chunk.split('\n          PY', 1)[0]
              lines = []
              for line in code.splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              Path(f'/tmp/project-storage-{i}.py').write_text('\n'.join(lines) + '\n')
          PY

      - name: Apply source changes
        run: python3 /tmp/project-storage-0.py

      - name: Generate GraphQL code
        run: make generate

      - name: Implement generated resolver
        run: python3 /tmp/project-storage-1.py

      - name: Format Go sources
        run: gofmt -w internal/objects/project.go internal/server/biz/project.go internal/server/biz/system.go internal/server/biz/request.go internal/server/biz/project_storage_policy_test.go internal/server/gql/axonhub.resolvers.go

      - name: Run focused backend tests
        run: go test ./internal/server/biz ./internal/server/gql

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal frontend docs
          git commit -m 'feat: add project-level payload storage policy [skip ci]'
          git push origin HEAD:feature/project-storage-policy
