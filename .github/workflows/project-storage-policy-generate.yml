name: Project storage policy implementation

on:
  push:
    branches:
      - feature/project-storage-policy
    paths:
      - .github/workflows/project-storage-policy-generate.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-storage-policy
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=-1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              s = s.replace(old, new, count)
              p.write_text(s)

          # Project JSON model: persistence is migration-free and backward compatible.
          replace(
              'internal/objects/project.go',
              'type ProjectProfiles struct {\n\tActiveProfile string           `json:"activeProfile"`\n\tProfiles      []ProjectProfile `json:"profiles"`\n}\n',
              '''type ProjectProfiles struct {\n\tActiveProfile  string                `json:"activeProfile"`\n\tProfiles       []ProjectProfile      `json:"profiles"`\n\tStoragePolicy  *ProjectStoragePolicy `json:"storagePolicy,omitempty"`\n}\n\n// ProjectStoragePolicy contains project-level overrides for request payload persistence.\n// Nil fields inherit the corresponding system-level setting. A project override can only\n// tighten the system policy; it can never re-enable a globally disabled setting.\ntype ProjectStoragePolicy struct {\n\tStoreRequestBody  *bool `json:"storeRequestBody,omitempty"`\n\tStoreResponseBody *bool `json:"storeResponseBody,omitempty"`\n\tStoreChunks       *bool `json:"storeChunks,omitempty"`\n}\n\nfunc (p *ProjectStoragePolicy) IsInherit() bool {\n\treturn p == nil || (p.StoreRequestBody == nil && p.StoreResponseBody == nil && p.StoreChunks == nil)\n}\n\nfunc (p *ProjectStoragePolicy) AllowsRequestBody() bool {\n\treturn p == nil || p.StoreRequestBody == nil || *p.StoreRequestBody\n}\n\nfunc (p *ProjectStoragePolicy) AllowsResponseBody() bool {\n\treturn p == nil || p.StoreResponseBody == nil || *p.StoreResponseBody\n}\n\nfunc (p *ProjectStoragePolicy) AllowsChunks() bool {\n\treturn p == nil || p.StoreChunks == nil || *p.StoreChunks\n}\n'''
          )

          # Preserve storage policy when routing profiles are edited, and add a dedicated updater.
          replace(
              'internal/server/biz/project.go',
              '''\tclient := s.entFromContext(ctx)\n\n\tproj, err := client.Project.UpdateOneID(id).\n\t\tSetProfiles(&profiles).\n\t\tSave(ctx)\n''',
              '''\tclient := s.entFromContext(ctx)\n\n\tcurrent, err := client.Project.Get(ctx, id)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf("failed to get project before updating profiles: %w", err)\n\t}\n\tif current.Profiles != nil {\n\t\tprofiles.StoragePolicy = current.Profiles.StoragePolicy\n\t}\n\n\tproj, err := client.Project.UpdateOneID(id).\n\t\tSetProfiles(&profiles).\n\t\tSave(ctx)\n'''
          )
          replace(
              'internal/server/biz/project.go',
              '// ValidateProjectProfiles validates that profile names are unique and the active profile exists.\n',
              '''// UpdateProjectStoragePolicy updates only the project-level payload storage override.\n// Existing routing profiles are preserved.\nfunc (s *ProjectService) UpdateProjectStoragePolicy(ctx context.Context, id int, policy objects.ProjectStoragePolicy) (*ent.Project, error) {\n\tclient := s.entFromContext(ctx)\n\n\tcurrent, err := client.Project.Get(ctx, id)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf("failed to get project before updating storage policy: %w", err)\n\t}\n\n\tprofiles := current.Profiles\n\tif profiles == nil {\n\t\tprofiles = &objects.ProjectProfiles{}\n\t}\n\n\tif policy.IsInherit() {\n\t\tprofiles.StoragePolicy = nil\n\t} else {\n\t\tpolicyCopy := policy\n\t\tprofiles.StoragePolicy = &policyCopy\n\t}\n\n\tproj, err := client.Project.UpdateOneID(id).\n\t\tSetProfiles(profiles).\n\t\tSave(ctx)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf("failed to update project storage policy: %w", err)\n\t}\n\n\ts.invalidateProjectCache(ctx, id)\n\treturn proj, nil\n}\n\n// ValidateProjectProfiles validates that profile names are unique and the active profile exists.\n'''
          )

          # Add effective policy resolution; system settings remain the hard upper bound.
          replace(
              'internal/server/biz/system.go',
              '''// StoragePolicyOrDefault retrieves the storage policy configuration or returns the default policy.\nfunc (s *SystemService) StoragePolicyOrDefault(ctx context.Context) *StoragePolicy {\n''',
              '''// ApplyProjectStoragePolicy combines the system policy with a project override.\n// Project settings are restrictive-only: a false system setting can never be re-enabled.\nfunc ApplyProjectStoragePolicy(systemPolicy *StoragePolicy, projectPolicy *objects.ProjectStoragePolicy) *StoragePolicy {\n\tif systemPolicy == nil {\n\t\tsystemPolicy = lo.ToPtr(defaultStoragePolicy)\n\t}\n\n\teffective := *systemPolicy\n\tif projectPolicy == nil {\n\t\treturn &effective\n\t}\n\n\teffective.StoreRequestBody = systemPolicy.StoreRequestBody && projectPolicy.AllowsRequestBody()\n\teffective.StoreResponseBody = systemPolicy.StoreResponseBody && projectPolicy.AllowsResponseBody()\n\teffective.StoreChunks = systemPolicy.StoreChunks && projectPolicy.AllowsChunks()\n\n\treturn &effective\n}\n\n// EffectiveStoragePolicy returns the storage policy after applying the current project's override.\n// Internal project lookup uses a system bypass because API-key request contexts do not necessarily\n// have project-read scope even though the API key is already bound to that project.\nfunc (s *SystemService) EffectiveStoragePolicy(ctx context.Context) (*StoragePolicy, error) {\n\tglobalPolicy, err := s.StoragePolicy(ctx)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\tprojectID, ok := contexts.GetProjectID(ctx)\n\tif !ok || projectID == 0 {\n\t\treturn globalPolicy, nil\n\t}\n\n\tlookupCtx := authz.WithSystemBypass(ctx, "project-storage-policy")\n\tproj, err := s.entFromContext(lookupCtx).Project.Get(lookupCtx, projectID)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf("failed to get project storage policy: %w", err)\n\t}\n\n\tif proj.Profiles == nil {\n\t\treturn globalPolicy, nil\n\t}\n\n\treturn ApplyProjectStoragePolicy(globalPolicy, proj.Profiles.StoragePolicy), nil\n}\n\n// StoragePolicyOrDefault retrieves the storage policy configuration or returns the default policy.\nfunc (s *SystemService) StoragePolicyOrDefault(ctx context.Context) *StoragePolicy {\n'''
          )
          replace(
              'internal/server/biz/system.go',
              '''func (s *SystemService) StoreChunks(ctx context.Context) (bool, error) {\n\tpolicy, err := s.StoragePolicy(ctx)\n''',
              '''func (s *SystemService) StoreChunks(ctx context.Context) (bool, error) {\n\tpolicy, err := s.EffectiveStoragePolicy(ctx)\n'''
          )

          # All request/execution body persistence now uses effective project policy.
          p = Path('internal/server/biz/request.go')
          s = p.read_text()
          n = s.count('s.SystemService.StoragePolicy(ctx)')
          if n < 4:
              raise SystemExit(f'expected >=4 StoragePolicy calls in request.go, found {n}')
          s = s.replace('s.SystemService.StoragePolicy(ctx)', 's.SystemService.EffectiveStoragePolicy(ctx)')
          # Use JSON null rather than {} to distinguish intentionally unretained request bodies.
          s = s.replace('objects.JSONRawMessage = []byte("{}")\n\t\trequestHeadersBytes', 'objects.JSONRawMessage = []byte("null")\n\t\trequestHeadersBytes')
          p.write_text(s)

          # GraphQL types and dedicated mutation.
          replace(
              'internal/server/gql/axonhub.graphql',
              '''type ProjectProfiles {\n  activeProfile: String!\n  profiles: [ProjectProfile!]\n}\n''',
              '''input ProjectStoragePolicyInput {\n  storeRequestBody: Boolean\n  storeResponseBody: Boolean\n  storeChunks: Boolean\n}\n\ntype ProjectStoragePolicy {\n  storeRequestBody: Boolean\n  storeResponseBody: Boolean\n  storeChunks: Boolean\n}\n\ntype ProjectProfiles {\n  activeProfile: String!\n  profiles: [ProjectProfile!]\n  storagePolicy: ProjectStoragePolicy\n}\n'''
          )
          replace(
              'internal/server/gql/axonhub.graphql',
              '  updateProjectProfiles(id: ID!, input: UpdateProjectProfilesInput!): Project!\n',
              '  updateProjectProfiles(id: ID!, input: UpdateProjectProfilesInput!): Project!\n  updateProjectStoragePolicy(id: ID!, input: ProjectStoragePolicyInput!): Project!\n'
          )
          replace(
              'internal/server/gql/gqlgen.yml',
              '''  ProjectProfile:\n    model:\n      - github.com/looplj/axonhub/internal/objects.ProjectProfile\n''',
              '''  ProjectProfile:\n    model:\n      - github.com/looplj/axonhub/internal/objects.ProjectProfile\n  ProjectStoragePolicy:\n    model:\n      - github.com/looplj/axonhub/internal/objects.ProjectStoragePolicy\n  ProjectStoragePolicyInput:\n    model:\n      - github.com/looplj/axonhub/internal/objects.ProjectStoragePolicy\n'''
          )

          # Pure policy matrix test.
          Path('internal/server/biz/project_storage_policy_test.go').write_text(r'''package biz

import (
    "testing"

    "github.com/looplj/axonhub/internal/objects"
    "github.com/stretchr/testify/require"
)

func boolPtr(v bool) *bool { return &v }

func TestApplyProjectStoragePolicy(t *testing.T) {
    tests := []struct {
        name string
        system bool
        project *bool
        want bool
    }{
        {"system on inherit", true, nil, true},
        {"system on enabled", true, boolPtr(true), true},
        {"system on disabled", true, boolPtr(false), false},
        {"system off inherit", false, nil, false},
        {"system off enabled", false, boolPtr(true), false},
        {"system off disabled", false, boolPtr(false), false},
    }

    for _, tt := range tests {
        t.Run(tt.name, func(t *testing.T) {
            system := &StoragePolicy{StoreRequestBody: tt.system, StoreResponseBody: tt.system, StoreChunks: tt.system}
            project := &objects.ProjectStoragePolicy{StoreRequestBody: tt.project, StoreResponseBody: tt.project, StoreChunks: tt.project}
            effective := ApplyProjectStoragePolicy(system, project)
            require.Equal(t, tt.want, effective.StoreRequestBody)
            require.Equal(t, tt.want, effective.StoreResponseBody)
            require.Equal(t, tt.want, effective.StoreChunks)
        })
    }
}
''')

          # Frontend schema: expose configured project policy from ProjectProfiles.
          replace(
              'frontend/src/features/projects/data/schema.ts',
              '''// Project Profiles schema\nexport const projectProfilesSchema = z.object({\n  activeProfile: z.string(),\n  profiles: z.array(projectProfileSchema).nullable(),\n});\n''',
              '''export const projectStoragePolicySchema = z.object({\n  storeRequestBody: z.boolean().nullable().optional(),\n  storeResponseBody: z.boolean().nullable().optional(),\n  storeChunks: z.boolean().nullable().optional(),\n});\nexport type ProjectStoragePolicy = z.infer<typeof projectStoragePolicySchema>;\n\n// Project Profiles schema\nexport const projectProfilesSchema = z.object({\n  activeProfile: z.string(),\n  profiles: z.array(projectProfileSchema).nullable(),\n  storagePolicy: projectStoragePolicySchema.optional().nullable(),\n});\n'''
          )

          # Query/mutation hook.
          p = Path('frontend/src/features/projects/data/projects.ts')
          s = p.read_text()
          s = s.replace(
              '''          profiles {\n            activeProfile\n            profiles {''',
              '''          profiles {\n            activeProfile\n            storagePolicy {\n              storeRequestBody\n              storeResponseBody\n              storeChunks\n            }\n            profiles {''',
              1,
          )
          insert_after = '''const UPDATE_PROJECT_MUTATION = `\n  mutation UpdateProject($id: ID!, $input: UpdateProjectInput!) {\n'''
          if insert_after not in s:
              raise SystemExit('project mutation anchor missing')
          policy_mutation = '''const UPDATE_PROJECT_STORAGE_POLICY_MUTATION = `\n  mutation UpdateProjectStoragePolicy($id: ID!, $input: ProjectStoragePolicyInput!) {\n    updateProjectStoragePolicy(id: $id, input: $input) {\n      id\n      profiles {\n        activeProfile\n        storagePolicy {\n          storeRequestBody\n          storeResponseBody\n          storeChunks\n        }\n        profiles {\n          name\n          channelIDs\n          channelTags\n          channelTagsMatchMode\n        }\n      }\n    }\n  }\n`;\n\n'''
          s = s.replace(insert_after, policy_mutation + insert_after, 1)
          s += '''\nexport function useUpdateProjectStoragePolicy() {\n  const queryClient = useQueryClient();\n  const { handleError } = useErrorHandler();\n\n  return useMutation({\n    mutationFn: async ({ id, input }: { id: string; input: { storeRequestBody?: boolean | null; storeResponseBody?: boolean | null; storeChunks?: boolean | null } }) => {\n      try {\n        const data = await graphqlRequest<{ updateProjectStoragePolicy: Project }>(UPDATE_PROJECT_STORAGE_POLICY_MUTATION, { id, input });\n        return projectSchema.parse(data.updateProjectStoragePolicy);\n      } catch (error) {\n        handleError(error, i18n.t('projects.storagePolicy.errors.updateFailed'));\n        throw error;\n      }\n    },\n    onSuccess: () => {\n      queryClient.invalidateQueries({ queryKey: ['projects'] });\n      queryClient.invalidateQueries({ queryKey: ['project'] });\n      queryClient.invalidateQueries({ queryKey: ['myProjects'] });\n      toast.success(i18n.t('projects.storagePolicy.messages.updateSuccess'));\n    },\n  });\n}\n'''
          p.write_text(s)

          # Projects context state.
          replace(
              'frontend/src/features/projects/context/projects-context.tsx',
              '''  profilesProject: Project | null;\n  setProfilesProject: (project: Project | null) => void;\n''',
              '''  profilesProject: Project | null;\n  setProfilesProject: (project: Project | null) => void;\n  storagePolicyProject: Project | null;\n  setStoragePolicyProject: (project: Project | null) => void;\n'''
          )
          replace(
              'frontend/src/features/projects/context/projects-context.tsx',
              '''  const [profilesProject, setProfilesProject] = useState<Project | null>(null);\n  const [isCreateDialogOpen, setIsCreateDialogOpen] = useState(false);\n''',
              '''  const [profilesProject, setProfilesProject] = useState<Project | null>(null);\n  const [storagePolicyProject, setStoragePolicyProject] = useState<Project | null>(null);\n  const [isCreateDialogOpen, setIsCreateDialogOpen] = useState(false);\n'''
          )
          replace(
              'frontend/src/features/projects/context/projects-context.tsx',
              '''        profilesProject,\n        setProfilesProject,\n        isCreateDialogOpen,\n''',
              '''        profilesProject,\n        setProfilesProject,\n        storagePolicyProject,\n        setStoragePolicyProject,\n        isCreateDialogOpen,\n'''
          )

          # Row action.
          replace(
              'frontend/src/features/projects/components/data-table-row-actions.tsx',
              "import { IconEdit, IconSettings, IconTrash } from '@tabler/icons-react';",
              "import { IconDatabaseCog, IconEdit, IconSettings, IconTrash } from '@tabler/icons-react';"
          )
          replace(
              'frontend/src/features/projects/components/data-table-row-actions.tsx',
              '''  const { setEditingProject, setArchivingProject, setActivatingProject, setDeletingProject, setProfilesProject } = useProjectsContext();\n''',
              '''  const { setEditingProject, setArchivingProject, setActivatingProject, setDeletingProject, setProfilesProject, setStoragePolicyProject } = useProjectsContext();\n'''
          )
          replace(
              'frontend/src/features/projects/components/data-table-row-actions.tsx',
              '''  const handleEdit = () => {\n''',
              '''  const handleStoragePolicy = () => {\n    setOpen(false);\n    setTimeout(() => setStoragePolicyProject(project), 0);\n  };\n\n  const handleEdit = () => {\n'''
          )
          replace(
              'frontend/src/features/projects/components/data-table-row-actions.tsx',
              '''        {projectPermissions.canWrite && (\n          <DropdownMenuItem onClick={handleProfiles}>\n            <IconSettings className='mr-2 h-4 w-4' />\n            {t('projects.profiles.title')}\n          </DropdownMenuItem>\n        )}\n''',
              '''        {projectPermissions.canWrite && (\n          <>\n            <DropdownMenuItem onClick={handleProfiles}>\n              <IconSettings className='mr-2 h-4 w-4' />\n              {t('projects.profiles.title')}\n            </DropdownMenuItem>\n            <DropdownMenuItem onClick={handleStoragePolicy}>\n              <IconDatabaseCog className='mr-2 h-4 w-4' />\n              {t('projects.storagePolicy.title')}\n            </DropdownMenuItem>\n          </>\n        )}\n'''
          )

          # Dedicated project storage dialog.
          Path('frontend/src/features/projects/components/project-storage-policy-dialog.tsx').write_text(r'''import { useEffect, useState } from 'react';
import { useTranslation } from 'react-i18next';
import { Button } from '@/components/ui/button';
import { Dialog, DialogContent, DialogDescription, DialogFooter, DialogHeader, DialogTitle } from '@/components/ui/dialog';
import { Label } from '@/components/ui/label';
import { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from '@/components/ui/select';
import { useStoragePolicy } from '@/features/system/data/system';
import type { ProjectStoragePolicy } from '../data/schema';

type Mode = 'inherit' | 'enabled' | 'disabled';

type Props = {
  open: boolean;
  onOpenChange: (open: boolean) => void;
  initialData?: ProjectStoragePolicy | null;
  loading?: boolean;
  onSubmit: (policy: ProjectStoragePolicy) => void;
};

const toMode = (value: boolean | null | undefined): Mode => value == null ? 'inherit' : value ? 'enabled' : 'disabled';
const fromMode = (mode: Mode): boolean | null => mode === 'inherit' ? null : mode === 'enabled';

export function ProjectStoragePolicyDialog({ open, onOpenChange, initialData, loading, onSubmit }: Props) {
  const { t } = useTranslation();
  const { data: systemPolicy } = useStoragePolicy();
  const [requestMode, setRequestMode] = useState<Mode>('inherit');
  const [responseMode, setResponseMode] = useState<Mode>('inherit');
  const [chunksMode, setChunksMode] = useState<Mode>('inherit');

  useEffect(() => {
    if (!open) return;
    setRequestMode(toMode(initialData?.storeRequestBody));
    setResponseMode(toMode(initialData?.storeResponseBody));
    setChunksMode(toMode(initialData?.storeChunks));
  }, [open, initialData]);

  const effective = (system: boolean | undefined, mode: Mode) => Boolean(system) && mode !== 'disabled';

  const Row = ({ label, mode, setMode, system }: { label: string; mode: Mode; setMode: (v: Mode) => void; system?: boolean }) => (
    <div className='space-y-2 rounded-md border p-3'>
      <div className='flex items-center justify-between gap-4'>
        <Label>{label}</Label>
        <Select value={mode} onValueChange={(v) => setMode(v as Mode)}>
          <SelectTrigger className='w-[180px]'><SelectValue /></SelectTrigger>
          <SelectContent>
            <SelectItem value='inherit'>{t('projects.storagePolicy.mode.inherit')}</SelectItem>
            <SelectItem value='enabled'>{t('projects.storagePolicy.mode.enabled')}</SelectItem>
            <SelectItem value='disabled'>{t('projects.storagePolicy.mode.disabled')}</SelectItem>
          </SelectContent>
        </Select>
      </div>
      <p className='text-xs text-muted-foreground'>
        {t('projects.storagePolicy.effective', {
          system: system ? t('projects.storagePolicy.on') : t('projects.storagePolicy.off'),
          effective: effective(system, mode) ? t('projects.storagePolicy.on') : t('projects.storagePolicy.off'),
        })}
      </p>
    </div>
  );

  return (
    <Dialog open={open} onOpenChange={onOpenChange}>
      <DialogContent className='max-w-xl'>
        <DialogHeader>
          <DialogTitle>{t('projects.storagePolicy.title')}</DialogTitle>
          <DialogDescription>{t('projects.storagePolicy.description')}</DialogDescription>
        </DialogHeader>
        <div className='space-y-3'>
          <Row label={t('projects.storagePolicy.requestBody')} mode={requestMode} setMode={setRequestMode} system={systemPolicy?.storeRequestBody} />
          <Row label={t('projects.storagePolicy.responseBody')} mode={responseMode} setMode={setResponseMode} system={systemPolicy?.storeResponseBody} />
          <Row label={t('projects.storagePolicy.chunks')} mode={chunksMode} setMode={setChunksMode} system={systemPolicy?.storeChunks} />
          <p className='text-xs text-muted-foreground'>{t('projects.storagePolicy.restrictiveOnly')}</p>
        </div>
        <DialogFooter>
          <Button variant='outline' onClick={() => onOpenChange(false)}>{t('common.buttons.cancel')}</Button>
          <Button disabled={loading} onClick={() => onSubmit({ storeRequestBody: fromMode(requestMode), storeResponseBody: fromMode(responseMode), storeChunks: fromMode(chunksMode) })}>
            {loading ? t('common.buttons.saving') : t('common.buttons.save')}
          </Button>
        </DialogFooter>
      </DialogContent>
    </Dialog>
  );
}
''')

          # Wire dialog into combined project dialogs.
          replace(
              'frontend/src/features/projects/components/projects-action-dialog.tsx',
              '''import { useCreateProject, useUpdateProject, useArchiveProject, useActivateProject, useDeleteProject, useUpdateProjectProfiles } from '../data/projects';\n''',
              '''import { useCreateProject, useUpdateProject, useArchiveProject, useActivateProject, useDeleteProject, useUpdateProjectProfiles, useUpdateProjectStoragePolicy } from '../data/projects';\n'''
          )
          replace(
              'frontend/src/features/projects/components/projects-action-dialog.tsx',
              "import { ProjectProfilesDialog } from './project-profiles-dialog';\n",
              "import { ProjectProfilesDialog } from './project-profiles-dialog';\nimport { ProjectStoragePolicyDialog } from './project-storage-policy-dialog';\n"
          )
          replace(
              'frontend/src/features/projects/components/projects-action-dialog.tsx',
              '// Combined Dialogs Component\n',
              '''function ProjectStoragePolicyDialogWrapper() {\n  const { storagePolicyProject, setStoragePolicyProject } = useProjectsContext();\n  const mutation = useUpdateProjectStoragePolicy();\n\n  return (\n    <ProjectStoragePolicyDialog\n      open={!!storagePolicyProject}\n      onOpenChange={(open) => !open && setStoragePolicyProject(null)}\n      initialData={storagePolicyProject?.profiles?.storagePolicy}\n      loading={mutation.isPending}\n      onSubmit={(input) => {\n        if (!storagePolicyProject?.id) return;\n        mutation.mutate({ id: storagePolicyProject.id, input }, { onSuccess: () => setStoragePolicyProject(null) });\n      }}\n    />\n  );\n}\n\n// Combined Dialogs Component\n'''
          )
          replace(
              'frontend/src/features/projects/components/projects-action-dialog.tsx',
              '''      <ProjectProfilesDialogWrapper />\n''',
              '''      <ProjectProfilesDialogWrapper />\n      <ProjectStoragePolicyDialogWrapper />\n'''
          )

          # Flat i18n files.
          translations = {
              'frontend/src/locales/en/projects.json': {
                  'projects.storagePolicy.title': 'Storage Policy',
                  'projects.storagePolicy.description': 'Control whether this project retains request, response, and streaming payloads. Trace metadata, usage, cost, and latency remain available.',
                  'projects.storagePolicy.requestBody': 'Request body',
                  'projects.storagePolicy.responseBody': 'Response body',
                  'projects.storagePolicy.chunks': 'Streaming chunks',
                  'projects.storagePolicy.mode.inherit': 'Inherit system setting',
                  'projects.storagePolicy.mode.enabled': 'Enabled',
                  'projects.storagePolicy.mode.disabled': 'Disabled',
                  'projects.storagePolicy.on': 'On',
                  'projects.storagePolicy.off': 'Off',
                  'projects.storagePolicy.effective': 'System: {{system}} · Effective: {{effective}}',
                  'projects.storagePolicy.restrictiveOnly': 'Project settings can disable storage, but cannot re-enable content storage disabled globally.',
                  'projects.storagePolicy.errors.updateFailed': 'Failed to update project storage policy',
                  'projects.storagePolicy.messages.updateSuccess': 'Project storage policy updated successfully',
              },
              'frontend/src/locales/zh-CN/projects.json': {
                  'projects.storagePolicy.title': '存储策略',
                  'projects.storagePolicy.description': '控制该项目是否持久化请求、响应和流式数据。Trace 元数据、用量、成本和延迟仍会保留。',
                  'projects.storagePolicy.requestBody': '请求正文',
                  'projects.storagePolicy.responseBody': '响应正文',
                  'projects.storagePolicy.chunks': '流式响应分片',
                  'projects.storagePolicy.mode.inherit': '继承系统设置',
                  'projects.storagePolicy.mode.enabled': '启用',
                  'projects.storagePolicy.mode.disabled': '禁用',
                  'projects.storagePolicy.on': '开启',
                  'projects.storagePolicy.off': '关闭',
                  'projects.storagePolicy.effective': '系统：{{system}} · 实际：{{effective}}',
                  'projects.storagePolicy.restrictiveOnly': '项目级策略只能进一步关闭存储，不能重新开启系统已全局关闭的内容存储。',
                  'projects.storagePolicy.errors.updateFailed': '更新项目存储策略失败',
                  'projects.storagePolicy.messages.updateSuccess': '项目存储策略更新成功',
              },
          }
          for path, additions in translations.items():
              p = Path(path)
              data = json.loads(p.read_text())
              data.update(additions)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Generate GraphQL code
        run: make generate

      - name: Implement generated resolver
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('internal/server/gql/axonhub.resolvers.go')
          s = p.read_text()
          marker = '// UpdateProjectStoragePolicy is the resolver for the updateProjectStoragePolicy field.\n'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('generated UpdateProjectStoragePolicy resolver not found')
          start = s.find('func ', pos)
          end = s.find('\n}\n', start) + 3
          old = s[start:end]
          sig_end = old.find('{')
          signature = old[:sig_end+1]
          body = signature + '\n\treturn r.projectService.UpdateProjectStoragePolicy(ctx, id.ID, input)\n}\n'
          s = s[:start] + body + s[end:]
          p.write_text(s)
          PY

      - name: Format Go sources
        run: |
          gofmt -w internal/objects/project.go internal/server/biz/project.go internal/server/biz/system.go internal/server/biz/request.go internal/server/biz/project_storage_policy_test.go internal/server/gql/axonhub.resolvers.go

      - name: Run focused backend tests
        run: go test ./internal/server/biz ./internal/server/gql

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal frontend docs
          git commit -m 'feat: add project-level payload storage policy [skip ci]'
          git push origin HEAD:feature/project-storage-policy
